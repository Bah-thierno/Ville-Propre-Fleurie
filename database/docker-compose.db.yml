# ==============================================================================
# COUCHE 3 : BASE DE DONNÉES SEULE (STANDALONE DATABASE RUNNER)
# ==============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: guinee_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-guinee_propre_db}
    ports:
      - "5432:5432"
    volumes:
      - guinee_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d guinee_propre_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  guinee_postgres_data:
    name: guinee_postgres_data
